<script>
/* Decide how much motion this device gets BEFORE first paint.
   full = good desktop, lite = phones / weaker devices / slow data, none = reduced motion */
(function () {
  var d = document.documentElement, n = navigator, c = n.connection || {};
  var none = matchMedia("(prefers-reduced-motion: reduce)").matches;
  var coarse = matchMedia("(pointer: coarse)").matches || innerWidth < 820;
  var weak = (n.hardwareConcurrency || 8) <= 4 || (n.deviceMemory || 8) <= 4;
  var slow = c.saveData || /(^|-)2g|3g/.test(c.effectiveType || "");
  d.dataset.motion = none ? "none" : (coarse || weak || slow) ? "lite" : "full";
})();
</script>
